name: Initial Load — Companies, ATS Boards & Jobs

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Run in order: 1) sync_companies_only -> 2) apply_verified_ats -> 3) sync_jobs_only"
        required: true
        default: "sync_companies_only"
        type: choice
        options:
          - sync_companies_only
          - apply_verified_ats
          - sync_jobs_only

jobs:
  run-step:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Step 1 — Load 24,077 companies from all.json
        if: ${{ inputs.step == 'sync_companies_only' }}
        run: python scripts/sync_companies.py

      - name: Step 2 — Activate 1,960 verified ATS boards
        if: ${{ inputs.step == 'apply_verified_ats' }}
        run: python scripts/apply_verified_ats.py

      - name: Step 3 — Fetch 33,000+ live jobs into Supabase
        if: ${{ inputs.step == 'sync_jobs_only' }}
        run: python scripts/sync_jobs.py
